<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Care Driver - ลำดับงานคนขับ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-10">

    <div class="bg-teal-700 text-white p-4 shadow-lg text-center font-bold text-xl flex justify-between items-center px-6">
        <span><i class="fa-solid fa-truck-medical mr-2"></i> Senior Care Driver</span>
        <span class="text-xs bg-teal-800 py-1 px-3 rounded-full font-normal">คิวงานเรียกรถ</span>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">
        <h2 class="font-bold text-gray-700 text-sm">รายการงานที่เข้ามา (เรียงตามลำดับคิว)</h2>
        
        <!-- รายการคิวงานจะถูกสร้างขึ้นมาตรงนี้อัตโนมัติ -->
        <div id="job-list" class="space-y-4">
            <p class="text-center text-gray-400 py-8">กำลังโหลดคิวงาน...</p>
        </div>
    </div>

    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        const firebaseConfig = {
            databaseURL: "https://dudyadmit-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ดึงรายการงานทั้งหมดแบบ Real-time
        database.ref('jobs').on('value', (snapshot) => {
            const container = document.getElementById('job-list');
            container.innerHTML = '';
            
            const data = snapshot.val();
            if (!data) {
                container.innerHTML = '<p class="text-center text-gray-400 py-8">ยังไม่มีคิวงานเข้ามา</p>';
                return;
            }

            // เล่นเสียงเตือน
            const audio = document.getElementById('alert-sound');
            if (audio) { audio.play().catch(e => {}); }

            // วนลูปแสดงรายการงานทั้งหมด
            Object.keys(data).reverse().forEach(key => {
                const job = data[key];
                
                const mapBtn = job.mapUrl ? 
                    `<a href="${job.mapUrl}" target="_blank" class="inline-block mt-2 bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1.5 rounded-lg border border-emerald-300">
                        <i class="fa-solid fa-map-location-dot mr-1"></i> กดเปิดนำทาง Google Maps
                     </a>` : '';

                const cardHtml = `
                    <div class="bg-white rounded-xl p-5 shadow-md border-l-4 border-teal-600 space-y-2">
                        <div class="flex justify-between items-start">
                            <span class="bg-teal-100 text-teal-800 text-xs font-bold px-2.5 py-0.5 rounded">${job.status}</span>
                            <span class="text-xs text-gray-400">${job.timestamp}</span>
                        </div>
                        <h3 class="text-base font-bold text-gray-800">${job.patientName}</h3>
                        <div class="text-xs text-gray-600 space-y-1">
                            <p><i class="fa-solid fa-house-chimney text-teal-600 w-4"></i> <b>รับ:</b> ${job.pickup}</p>
                            ${mapBtn}
                            <p class="mt-1"><i class="fa-solid fa-hospital text-red-500 w-4"></i> <b>ส่ง:</b> ${job.dropoff}</p>
                            <p><i class="fa-solid fa-phone text-blue-500 w-4"></i> <b>โทร:</b> <a href="tel:${job.phone}" class="text-blue-600 font-bold underline">${job.phone}</a></p>
                            <p><i class="fa-solid fa-notes-medical text-purple-600 w-4"></i> <b>หมายเหตุ:</b> ${job.wheelchair}, ${job.helper}</p>
                        </div>
                        <div class="pt-2 grid grid-cols-2 gap-2 text-xs">
                            <button onclick="updateJobStatus('${key}', 'กำลังไปรับ')" class="bg-blue-600 text-white font-bold py-2 rounded-lg">กำลังไปรับ</button>
                            <button onclick="updateJobStatus('${key}', 'เสร็จสิ้น')" class="bg-emerald-600 text-white font-bold py-2 rounded-lg">เสร็จสิ้นงาน</button>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        });

        function updateJobStatus(key, newStatus) {
            database.ref('jobs/' + key).update({ status: newStatus });
        }
    </script>
</body>
</html>
